<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <title>旅行语言闪卡</title>
  <style>
    :root { color-scheme: light; --bg:#f5f3ee; --card:#fffdf8; --text:#182330; --muted:#69727b; --en:#28666e; --ko:#9b4b55; --sound:#7b5a2e; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center;
      padding:max(24px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
      color:var(--text); background:radial-gradient(circle at 90% 0,rgba(229,166,65,.22),transparent 34%),var(--bg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    }
    main { width:min(100%,680px); }
    .eyebrow { color:var(--en); font-weight:800; font-size:12px; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:8px 0 8px; font-size:clamp(34px,10vw,54px); line-height:1.08; letter-spacing:-.04em; }
    .lead { margin:0 0 28px; color:var(--muted); line-height:1.65; }
    .grid { display:grid; gap:14px; }
    .card {
      display:block; padding:24px; border:1px solid rgba(24,35,48,.11); border-radius:24px;
      color:inherit; text-decoration:none; background:var(--card); box-shadow:0 16px 45px rgba(26,38,48,.10);
    }
    .deck-link:active { opacity:.85; }
    .tag { display:inline-block; margin-bottom:20px; padding:6px 10px; border-radius:99px; color:#fff; font-size:12px; font-weight:800; }
    .english .tag { background:var(--en); }
    .korean .tag { background:var(--ko); }
    .sound .tag { background:var(--sound); }
    h2 { margin:0 0 8px; font-size:25px; }
    .card p { margin:0; color:var(--muted); line-height:1.55; }
    .arrow { display:block; margin-top:22px; color:var(--en); font-weight:800; }
    .korean .arrow { color:var(--ko); }
    .sound .arrow { color:var(--sound); }
    footer { margin-top:22px; color:var(--muted); font-size:12px; text-align:center; }
    @media (min-width:620px) { .grid { grid-template-columns:1fr 1fr; } }
  .deck-link{display:block;color:inherit;text-decoration:none}.card{padding:24px}.deck-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.deck-actions .arrow{margin:0;font-size:14px}.shelve-button{border:1px solid rgba(24,35,48,.13);border-radius:10px;background:transparent;color:var(--muted);font:inherit;font-size:12px;min-height:36px;padding:6px 12px;cursor:pointer}.shelve-button:hover{color:var(--en);border-color:var(--en);background:rgba(40,102,110,.05)}.section-title{font-size:15px;font-weight:750;margin:0 0 14px;display:flex;justify-content:space-between}.count{font-weight:500;color:var(--muted);font-size:13px}.shelf{margin-top:26px;border-top:1px solid rgba(24,35,48,.12);padding-top:18px}.shelf summary{cursor:pointer;color:var(--muted);font-size:14px;padding:10px 0;min-height:44px}.shelf-note{font-size:12px;color:var(--muted);line-height:1.65;margin:0 0 14px}.shelf-list{display:grid;gap:10px}.shelf-item{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--card);border:1px solid rgba(24,35,48,.11);border-radius:15px;padding:14px 16px}.shelf-item a{color:var(--text);font-size:14px;text-decoration:none;line-height:1.5}.empty{color:var(--muted);font-size:14px;padding:20px 0;line-height:1.7}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;transition:.25s;z-index:10;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--en);outline-offset:4px}@media(prefers-reduced-motion:reduce){*{transition:none!important}}[hidden]{display:none!important}
</style>
</head>
<body>
  <main>
    <div class="eyebrow">Travel Language Cards</div>
    <h1>旅行语言闪卡</h1>
    <p class="lead">每次专注少量卡组，暂时不练的先收纳起来。</p>
    <div class="section-title"><span>正在复习</span><span class="count" id="activeCount"></span></div>
    <div class="grid" id="activeDecks"></div>
    <div class="empty" id="emptyActive" hidden>当前没有正在复习的卡组。展开下方“已收纳卡组”，恢复想练习的内容。</div>
    <details class="shelf" id="shelf"><summary id="shelfSummary">已收纳卡组（0）</summary><p class="shelf-note">暂时不复习的卡组放在这里，内容和学习进度都会保留，随时可以恢复。</p><div class="shelf-list" id="archivedDecks"></div><p class="empty" id="emptyShelf">还没有收纳卡组。</p></details>
    <noscript><p>请启用 JavaScript 管理卡组。<a href="sejong-lesson1.html">第一课</a> · <a href="english.html">旅行英语</a> · <a href="korean.html">旅行韩语</a></p></noscript>
    <footer>收纳状态与学习进度保存在当前浏览器，不跨设备同步。</footer>
  </main>
<div class="toast" id="toast" role="status" aria-live="polite"></div><script src="assets/deck-library.js"></script></body>
</html>
