<script>
  const config=JSON.parse(document.getElementById('moduleData').textContent);
  const $=s=>document.querySelector(s);const groups=['全部',...new Set(config.cards.map(c=>c.group))];
  const japanese=config.lang==='ja-JP',letterLabel=japanese?'字母音 ×2':'字母音',wordLabel=japanese?'词汇音（分开）':'词汇音';
  let mode='learn',activeGroup='全部',testIndex=0,flipped=false,randomMode=false,activeAudio=null,activeButton=null,touchStartX=0,ignoreClickUntil=0;
  const themeKey='travel-flashcards-pronunciation-theme-v1';document.documentElement.dataset.theme=localStorage.getItem(themeKey)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
  function visibleCards(){return activeGroup==='全部'?config.cards:config.cards.filter(c=>c.group===activeGroup)}
  function audioButton(label,audio,speech,extra=''){return `<button class="audio-btn ${extra}" data-audio="${esc(audio)}" data-speech="${esc(speech)}">▶ ${label}</button>`}
  function examples(c){return c.examples.map(x=>`<div class="word">${esc(x[0])}<span>${esc(x[1])} · ${esc(x[2])}</span></div>`).join('')}
  function renderRules(){$('#rules').innerHTML=config.rules.map(r=>`<article class="rule"><strong>${esc(r[0])}</strong><p>${esc(r[1])}</p></article>`).join('')}
  function renderChips(){$('#chips').innerHTML=groups.map(g=>`<button class="chip ${g===activeGroup?'active':''}" data-group="${esc(g)}">${esc(g)}</button>`).join('')}
  function renderLearning(){const cards=visibleCards();$('#learnCount').textContent=`${cards.length} 张`;$('#grid').innerHTML=cards.map(c=>`<article class="learn-card"><div class="glyphs"><span class="glyph">${esc(c.primary)}</span>${c.secondary?`<span class="secondary">${esc(c.secondary)}</span>`:''}</div><div class="roman">${esc(c.roman)}</div><p class="sound">${esc(c.sound)}</p><div class="audio-row">${audioButton(letterLabel,c.letterAudio,c.letterSpeech)}${audioButton(wordLabel,c.wordAudio,c.wordSpeech)}</div><p class="memory"><strong>联想：</strong>${esc(c.memory)}</p><div class="examples">${examples(c)}</div></article>`).join('')}
  function currentCard(){const cards=visibleCards();if(!cards.length)return null;testIndex=Math.max(0,Math.min(testIndex,cards.length-1));return cards[testIndex]}
  function renderTest(){const cards=visibleCards(),c=currentCard();if(!c)return;$('#testCount').textContent=`${testIndex+1} / ${cards.length}`;$('#testGroup').textContent=c.group;$('#testFront').innerHTML=`<span class="face-label">字母辨认</span><div class="test-glyphs"><span class="glyph">${esc(c.primary)}</span>${c.secondary?`<span class="secondary">${esc(c.secondary)}</span>`:''}</div>${audioButton(japanese?'听字母音（2遍）':'听字母音',c.letterAudio,c.letterSpeech,'letter-check')}<span class="tap-hint"><span>先自己读</span><span>点击看答案 →</span></span>`;$('#testBack').innerHTML=`<span class="face-label">发音与联想</span><div class="answer-wrap"><div class="roman">${esc(c.roman)}</div><p class="sound">${esc(c.sound)}</p><p class="memory"><strong>联想：</strong>${esc(c.memory)}</p><div class="examples">${examples(c)}</div><div class="audio-row">${audioButton(japanese?'再听字母音 ×2':'再听字母音',c.letterAudio,c.letterSpeech)}${audioButton(japanese?'听两个词（分开）':'听词汇音',c.wordAudio,c.wordSpeech)}</div></div><span class="tap-hint"><span>跟读两遍</span><span>点击回到正面 ↩</span></span>`;$('#testCard').classList.toggle('flipped',flipped);$('#testCard').setAttribute('aria-pressed',String(flipped));$('#flipNote').textContent=flipped?'点击卡片回到字母正面':'先自己读，再点“听字母音”检查；点击卡片翻面';$('#randomButton').classList.toggle('active',randomMode)}
  function setMode(next){mode=next;$('#learnMode').hidden=mode!=='learn';$('#testMode').hidden=mode!=='test';document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#modeNote').textContent=mode==='learn'?'总览字母、发音、词汇和记忆提示，适合第一次学习与查阅。':'正面先认读字母并播放字母音检查，翻面查看词汇和联想。';if(mode==='test')renderTest()}
  function fallbackSpeech(text){if(!('speechSynthesis'in window))return toast('当前浏览器无法播放语音');const u=new SpeechSynthesisUtterance(text);u.lang=config.lang;u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
  function play(button){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}if(activeButton)activeButton.classList.remove('playing');const audio=new Audio(button.dataset.audio);activeAudio=audio;activeButton=button;button.classList.add('playing');const done=()=>button.classList.remove('playing');audio.addEventListener('ended',done,{once:true});audio.addEventListener('error',()=>{done();fallbackSpeech(button.dataset.speech)},{once:true});audio.play().catch(()=>{done();fallbackSpeech(button.dataset.speech)})}
  function move(step){const cards=visibleCards();if(randomMode&&cards.length>1){let next;do{next=Math.floor(Math.random()*cards.length)}while(next===testIndex);testIndex=next}else testIndex=(testIndex+step+cards.length)%cards.length;flipped=false;renderTest()}
  function flip(){flipped=!flipped;renderTest()}
  function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1600)}
  document.querySelector('.mode-tabs').addEventListener('click',e=>{const b=e.target.closest('.mode-btn');if(b)setMode(b.dataset.mode)});
  $('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;activeGroup=b.dataset.group;testIndex=0;flipped=false;renderChips();renderLearning();renderTest()});
  $('#grid').addEventListener('click',e=>{const b=e.target.closest('.audio-btn');if(b)play(b)});
  $('#testCard').addEventListener('click',e=>{if(Date.now()<ignoreClickUntil)return;const b=e.target.closest('.audio-btn');if(b){e.stopPropagation();play(b)}else flip()});
  $('#testCard').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest('.audio-btn')){e.preventDefault();flip()}});
  $('#testCard').addEventListener('pointerdown',e=>{touchStartX=e.clientX});$('#testCard').addEventListener('pointerup',e=>{const d=e.clientX-touchStartX;if(Math.abs(d)>65){ignoreClickUntil=Date.now()+400;move(d<0?1:-1)}});
  $('#prevButton').addEventListener('click',()=>move(-1));$('#nextButton').addEventListener('click',()=>move(1));$('#randomButton').addEventListener('click',()=>{randomMode=!randomMode;renderTest();toast(randomMode?'随机抽卡已开启':'顺序复习已开启')});
  $('#themeButton').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem(themeKey,next)});
  renderRules();renderChips();renderLearning();renderTest();
</script></body></html>
