<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <title>旅行韩语 100 张闪卡</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ee;
      --surface: #fffdf8;
      --surface-2: #ebe8df;
      --text: #182330;
      --muted: #68717b;
      --accent: #28666e;
      --accent-2: #e5a641;
      --line: rgba(24, 35, 48, .12);
      --shadow: 0 20px 60px rgba(26, 38, 48, .14);
      --good: #237a57;
      --maybe: #b47615;
      --again: #b64d4d;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #11181d;
      --surface: #192228;
      --surface-2: #243038;
      --text: #f2f4ef;
      --muted: #a9b3b8;
      --accent: #6fc2c8;
      --accent-2: #e7b765;
      --line: rgba(255, 255, 255, .12);
      --shadow: 0 20px 60px rgba(0, 0, 0, .32);
      --good: #67c998;
      --maybe: #e2af58;
      --again: #e17c7c;
    }
    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 85% -10%, rgba(229, 166, 65, .20), transparent 34%),
        radial-gradient(circle at -10% 70%, rgba(40, 102, 110, .15), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; color: inherit; }
    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 5px 0 4px; font-size: clamp(25px, 7vw, 38px); line-height: 1.08; letter-spacing: -.03em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .icon-btn {
      width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%;
      background: color-mix(in srgb, var(--surface) 90%, transparent); cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
    }
    .progress-panel {
      margin: 20px 0 14px; padding: 14px 15px; background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(12px);
    }
    .progress-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
    .progress-head strong { color: var(--text); font-size: 14px; }
    .track { height: 8px; margin-top: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s ease; }
    .chips { display: flex; gap: 8px; margin: 0 -16px 14px; padding: 2px 16px 8px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--line); border-radius: 99px; padding: 9px 13px;
      background: var(--surface); color: var(--muted); font-size: 13px; cursor: pointer;
    }
    .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
    .card-meta { display: flex; justify-content: space-between; align-items: center; margin: 3px 3px 9px; color: var(--muted); font-size: 13px; }
    .status-pill { padding: 4px 9px; border-radius: 99px; background: var(--surface-2); }
    .stage { perspective: 1200px; }
    .flashcard {
      position: relative; width: 100%; height: clamp(350px, 55vh, 470px); padding: 0; border: 0;
      background: transparent; cursor: pointer; border-radius: 28px; touch-action: pan-y;
    }
    .card-inner { position: absolute; inset: 0; transition: transform .5s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
    .flashcard.flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
      padding: 25px 24px 22px; border: 1px solid var(--line); border-radius: 28px;
      background: var(--surface); box-shadow: var(--shadow); backface-visibility: hidden; -webkit-backface-visibility: hidden;
      overflow: auto;
    }
    .front::before, .back::before {
      content: ""; position: absolute; width: 170px; height: 170px; border-radius: 50%;
      right: -65px; top: -70px; background: color-mix(in srgb, var(--accent-2) 20%, transparent);
    }
    .back { transform: rotateY(180deg); background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--accent) 8%, var(--surface))); }
    .face-label { position: relative; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .prompt { position: relative; margin: auto 0; font-size: clamp(27px, 7vw, 42px); line-height: 1.34; font-weight: 760; letter-spacing: -.02em; }
    .answer { position: relative; margin: auto 0 12px; font-size: clamp(26px, 7vw, 42px); line-height: 1.28; font-weight: 760; letter-spacing: -.02em; color: var(--accent); }
    .notes { color: var(--text); font-size: 15px; line-height: 1.55; }
    .notes p { margin: 7px 0 0; }
    .notes strong { color: var(--accent-2); }
    .tap-hint { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    .speech-row { display: flex; gap: 8px; margin-top: 16px; }
    .speech-btn { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); cursor: pointer; }
    .voice-panel {
      display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center;
      margin-top: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 16px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
    }
    .voice-copy { min-width: 0; }
    .voice-copy label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 800; color: var(--accent); }
    .voice-select {
      width: 100%; min-height: 34px; border: 0; outline: 0; padding: 0; background: transparent;
      color: var(--text); font: inherit; font-size: 13px; text-overflow: ellipsis;
    }
    .preview-btn {
      min-height: 40px; border: 1px solid var(--line); border-radius: 12px; padding: 0 13px;
      background: var(--surface-2); color: var(--text); cursor: pointer; font-weight: 750;
    }
    .nav-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 14px; }
    .nav-btn { min-height: 48px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); cursor: pointer; font-weight: 700; }
    .random-btn { width: 48px; height: 48px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); cursor: pointer; }
    .random-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    .ratings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; opacity: .35; pointer-events: none; transition: opacity .2s ease; }
    .ratings.ready { opacity: 1; pointer-events: auto; }
    .rate-btn { min-height: 49px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); cursor: pointer; font-weight: 750; }
    .rate-btn[data-value="again"] { color: var(--again); }
    .rate-btn[data-value="maybe"] { color: var(--maybe); }
    .rate-btn[data-value="known"] { color: var(--good); }
    .footer-actions { display: flex; justify-content: center; gap: 14px; margin-top: 18px; }
    .text-btn { border: 0; background: transparent; color: var(--muted); padding: 8px; cursor: pointer; font-size: 13px; text-decoration: none; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 18px);
      opacity: 0; pointer-events: none; background: var(--text); color: var(--bg); padding: 10px 16px;
      border-radius: 99px; font-size: 13px; transition: .25s ease; z-index: 10;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-height: 690px) {
      .flashcard { height: 330px; }
      .progress-panel { margin-top: 12px; }
      .face { padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">Travel Korean</div>
        <h1>旅行韩语闪卡</h1>
        <p class="subtitle">100 个真实场景 · 点击翻面 · 离线可用</p>
      </div>
      <button class="icon-btn" id="themeButton" aria-label="切换深色模式">◐</button>
    </header>

    <section class="progress-panel" aria-label="学习进度">
      <div class="progress-head">
        <span>总掌握进度</span>
        <strong id="progressText">0 / 100</strong>
      </div>
      <div class="track"><div class="fill" id="progressFill"></div></div>
    </section>

    <nav class="chips" id="categoryChips" aria-label="闪卡分类"></nav>

    <div class="card-meta">
      <span id="positionText">1 / 100</span>
      <span class="status-pill" id="statusText">未复习</span>
    </div>

    <section class="stage" aria-live="polite">
      <button class="flashcard" id="flashcard" aria-label="点击翻转闪卡" aria-pressed="false">
        <span class="card-inner">
          <span class="face front">
            <span class="face-label" id="frontLabel">中文任务</span>
            <span class="prompt" id="prompt"></span>
            <span class="tap-hint"><span>先大声说韩语</span><span>点击看答案 →</span></span>
          </span>
          <span class="face back">
            <span class="face-label">推荐表达</span>
            <span>
              <span class="answer" id="answer"></span>
              <span class="notes" id="notes"></span>
              <span class="speech-row">
                <span class="speech-btn" data-rate="0.90">▶ 自然朗读</span>
                <span class="speech-btn" data-rate="0.78">▶ 慢速跟读</span>
              </span>
            </span>
            <span class="tap-hint"><span>说对意思即可</span><span>点击回到正面 ↩</span></span>
          </span>
        </span>
      </button>
    </section>

    <section class="voice-panel" aria-label="朗读音色设置">
      <div class="voice-copy">
        <label for="voiceSelect">朗读音色 · 已排除怪声和特效声音</label>
        <select class="voice-select" id="voiceSelect">
          <option value="">自动选择自然音色</option>
        </select>
      </div>
      <button class="preview-btn" id="previewVoiceButton">试听</button>
    </section>

    <div class="nav-row">
      <button class="nav-btn" id="prevButton">← 上一张</button>
      <button class="random-btn" id="randomButton" aria-label="切换随机抽卡" title="随机抽卡">⌘</button>
      <button class="nav-btn" id="nextButton">下一张 →</button>
    </div>

    <div class="ratings" id="ratings" aria-label="标记掌握程度">
      <button class="rate-btn" data-value="again">❌ 不会</button>
      <button class="rate-btn" data-value="maybe">△ 模糊</button>
      <button class="rate-btn" data-value="known">✓ 会了</button>
    </div>

    <div class="footer-actions">
      <a class="text-btn" href="korean-pronunciation.html">韩语字母与发音</a>
      <button class="text-btn" id="reviewButton">只复习不会和模糊</button>
      <button class="text-btn" id="resetButton">重置进度</button>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<\/strong>jae-mi-i-sseo-yo<\/p><p>景点、活动、故事都能用<\/p>"}, {"id": 87, "category": "简单社交", "prompt": "很漂亮", "answer": "예뻐요", "audio": "korean-audio/087.wav", "notes": "<p><strong>罗马音：<\/strong>ye-ppeo-yo<\/p><p>风景、物品皆可<\/p>"}, {"id": 88, "category": "简单社交", "prompt": "您推荐哪里？", "answer": "어디를 추천하세요?", "audio": "korean-audio/088.wav", "notes": "<p><strong>罗马音：<\/strong>eo-di-reul chu-cheon-ha-se-yo<\/p><p>请当地人推荐地点<\/p>"}, {"id": 89, "category": "简单社交", "prompt": "什么最好吃？", "answer": "뭐가 제일 맛있어요?", "audio": "korean-audio/089.wav", "notes": "<p><strong>罗马音：<\/strong>mwo-ga je-il ma-si-sseo-yo<\/p><p>请当地人或店员推荐<\/p>"}, {"id": 90, "category": "简单社交", "prompt": "我真的很喜欢韩国", "answer": "한국이 정말 좋아요", "audio": "korean-audio/090.wav", "notes": "<p><strong>罗马音：<\/strong>han-gu-gi jeong-mal jo-a-yo<\/p><p>友好结束交流<\/p>"}, {"id": 91, "category": "时间数量", "prompt": "今天", "answer": "오늘", "audio": "korean-audio/091.wav", "notes": "<p><strong>罗马音：<\/strong>o-neul<\/p><p>可配合日期、营业时间使用<\/p>"}, {"id": 92, "category": "时间数量", "prompt": "明天", "answer": "내일", "audio": "korean-audio/092.wav", "notes": "<p><strong>罗马音：<\/strong>nae-il<\/p><p>订票、订位高频词<\/p>"}, {"id": 93, "category": "时间数量", "prompt": "现在", "answer": "지금", "audio": "korean-audio/093.wav", "notes": "<p><strong>罗马音：<\/strong>ji-geum<\/p><p>表示时间紧迫<\/p>"}, {"id": 94, "category": "时间数量", "prompt": "这里", "answer": "여기", "audio": "korean-audio/094.wav", "notes": "<p><strong>罗马音：<\/strong>yeo-gi<\/p><p>边指边说即可<\/p>"}, {"id": 95, "category": "时间数量", "prompt": "那里", "answer": "거기", "audio": "korean-audio/095.wav", "notes": "<p><strong>罗马音：<\/strong>geo-gi<\/p><p>指离对方较近的位置<\/p>"}, {"id": 96, "category": "时间数量", "prompt": "一个", "answer": "하나", "audio": "korean-audio/096.wav", "notes": "<p><strong>罗马音：<\/strong>ha-na<\/p><p>买东西时使用<\/p>"}, {"id": 97, "category": "时间数量", "prompt": "两个", "answer": "둘", "audio": "korean-audio/097.wav", "notes": "<p><strong>罗马音：<\/strong>dul<\/p><p>名词前常变成 `두 du`，如两张票<\/p>"}, {"id": 98, "category": "时间数量", "prompt": "有", "answer": "있어요", "audio": "korean-audio/098.wav", "notes": "<p><strong>罗马音：<\/strong>i-sseo-yo<\/p><p>问句语调上扬就是“有吗？”<\/p>"}, {"id": 99, "category": "时间数量", "prompt": "没有", "answer": "없어요", "audio": "korean-audio/099.wav", "notes": "<p><strong>罗马音：<\/strong>eop-sseo-yo<\/p><p>库存、设施、时间都能用<\/p>"}, {"id": 100, "category": "时间数量", "prompt": "好／喜欢", "answer": "좋아요", "audio": "korean-audio/100.wav", "notes": "<p><strong>罗马音：<\/strong>jo-a-yo<\/p><p>接受建议或表达喜欢<\/p>"}]</script>
  <script>
    const cards = JSON.parse(document.getElementById('cardData').textContent);
    const storageKey = 'travel-korean-flashcards-v1';
    const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
    const state = {
      statuses: saved.statuses || {},
      category: saved.category || '全部',
      currentId: saved.currentId || 1,
      random: saved.random || false,
      reviewOnly: saved.reviewOnly || false,
      voiceName: saved.voiceName || '',
      theme: saved.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
      flipped: false
    };

    const $ = (selector) => document.querySelector(selector);
    const flashcard = $('#flashcard');
    const promptEl = $('#prompt');
    const answerEl = $('#answer');
    const notesEl = $('#notes');
    const ratingsEl = $('#ratings');
    const categoryNames = ['全部', ...new Set(cards.map(card => card.category))];
    let touchStartX = 0;

    function save() {
      localStorage.setItem(storageKey, JSON.stringify({
        statuses: state.statuses,
        category: state.category,
        currentId: state.currentId,
        random: state.random,
        reviewOnly: state.reviewOnly,
        voiceName: state.voiceName,
        theme: state.theme
      }));
    }

    function visibleCards() {
      let list = cards.filter(card => state.category === '全部' || card.category === state.category);
      if (state.reviewOnly) list = list.filter(card => state.statuses[card.id] !== 'known');
      return list;
    }

    function currentCard() {
      const list = visibleCards();
      if (!list.length) return null;
      return list.find(card => card.id === state.currentId) || list[0];
    }

    function statusLabel(value) {
      return {known: '✓ 已掌握', maybe: '△ 模糊', again: '❌ 不会'}[value] || '未复习';
    }

    function renderChips() {
      $('#categoryChips').innerHTML = categoryNames.map(name =>
        `<button class="chip ${state.category === name ? 'active' : ''}" data-category="${name}">${name}</button>`
      ).join('');
    }

    function render() {
      document.documentElement.dataset.theme = state.theme;
      const list = visibleCards();
      if (!list.length) {
        state.reviewOnly = false;
        showToast('这一组已经全部掌握！');
        return render();
      }
      let card = currentCard();
      if (!list.some(item => item.id === state.currentId)) {
        state.currentId = list[0].id;
        card = list[0];
      }
      const index = list.findIndex(item => item.id === card.id);
      promptEl.textContent = card.prompt;
      answerEl.textContent = card.answer;
      notesEl.innerHTML = card.notes;
      $('#frontLabel').textContent = `${String(card.id).padStart(2, '0')} · ${card.category}`;
      $('#positionText').textContent = `${index + 1} / ${list.length}`;
      $('#statusText').textContent = statusLabel(state.statuses[card.id]);
      flashcard.classList.toggle('flipped', state.flipped);
      flashcard.setAttribute('aria-pressed', String(state.flipped));
      ratingsEl.classList.toggle('ready', state.flipped);
      $('#randomButton').classList.toggle('active', state.random);
      $('#reviewButton').textContent = state.reviewOnly ? '查看当前分类全部卡片' : '只复习不会和模糊';
      const known = Object.values(state.statuses).filter(value => value === 'known').length;
      $('#progressText').textContent = `${known} / 100`;
      $('#progressFill').style.width = `${known}%`;
      renderChips();
      save();
    }

    function move(direction) {
      speechSynthesis.cancel();
      const list = visibleCards();
      if (!list.length) return;
      const currentIndex = Math.max(0, list.findIndex(card => card.id === state.currentId));
      let nextIndex;
      if (state.random && list.length > 1) {
        do { nextIndex = Math.floor(Math.random() * list.length); } while (nextIndex === currentIndex);
      } else {
        nextIndex = (currentIndex + direction + list.length) % list.length;
      }
      state.currentId = list[nextIndex].id;
      state.flipped = false;
      render();
    }

    function flip() {
      state.flipped = !state.flipped;
      render();
    }

    function mark(value) {
      const card = currentCard();
      if (!card) return;
      state.statuses[card.id] = value;
      showToast(statusLabel(value));
      save();
      setTimeout(() => move(1), 160);
    }

    const noveltyVoicePattern = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Pipe Organ|Princess|Ralph|Trinoids|Whisper|Wobble|Zarvox|Organ|Novelty/i;

    function koreanVoices() {
      if (!('speechSynthesis' in window)) return [];
      return speechSynthesis.getVoices().filter(voice =>
        /^ko([-_]|$)/i.test(voice.lang) && !noveltyVoicePattern.test(voice.name)
      );
    }

    function voiceScore(voice) {
      let score = 0;
      const name = voice.name;
      if (/Natural|Premium|Enhanced/i.test(name)) score += 120;
      if (/Yuna|유나/i.test(name)) score += 115;
      if (/Microsoft (SunHi|Heami)/i.test(name)) score += 110;
      if (/Google.*(한국어|Korean)/i.test(name)) score += 100;
      if (/Korean|한국어/i.test(name)) score += 80;
      if (/^ko-KR$/i.test(voice.lang)) score += 25;
      if (voice.localService) score += 8;
      return score;
    }

    function recommendedVoice() {
      return [...koreanVoices()].sort((a, b) => voiceScore(b) - voiceScore(a))[0] || null;
    }

    function selectedVoice() {
      const voices = koreanVoices();
      return voices.find(voice => voice.name === state.voiceName) || recommendedVoice();
    }

    function populateVoices() {
      const select = $('#voiceSelect');
      const voices = [...koreanVoices()].sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name));
      const recommended = recommendedVoice();
      select.innerHTML = `<option value="">自动推荐${recommended ? `：${recommended.name}` : ''}</option>` +
        voices.map(voice => `<option value="${voice.name.replaceAll('&', '&amp;').replaceAll('"', '&quot;')}">${voice.name} · ${voice.lang}</option>`).join('');
      select.value = voices.some(voice => voice.name === state.voiceName) ? state.voiceName : '';
    }

    let activeAudio = null;

    function browserSpeech(text, rate) {
      if (!('speechSynthesis' in window)) return showToast('当前浏览器不支持语音朗读');
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = rate;
      utterance.pitch = 1.0;
      utterance.volume = 1;
      utterance.voice = selectedVoice();
      speechSynthesis.speak(utterance);
    }

    function speakText(text, rate = 0.90, audioSrc = '') {
      if (!audioSrc) return browserSpeech(text, rate);
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
      }
      const audio = new Audio(audioSrc);
      activeAudio = audio;
      audio.playbackRate = rate < 0.85 ? 0.82 : 1;
      audio.preservesPitch = true;
      let usedFallback = false;
      const fallback = () => {
        if (usedFallback) return;
        usedFallback = true;
        browserSpeech(text, rate);
      };
      audio.addEventListener('error', fallback, { once: true });
      audio.play().catch(fallback);
    }

    function speak(rate) {
      const card = currentCard();
      if (card) speakText(card.answer, rate, card.audio);
    }

    let toastTimer;
    function showToast(message) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    flashcard.addEventListener('click', event => {
      const speechButton = event.target.closest('.speech-btn');
      if (speechButton) {
        event.stopPropagation();
        speak(Number(speechButton.dataset.rate));
        return;
      }
      flip();
    });
    flashcard.addEventListener('pointerdown', event => { touchStartX = event.clientX; });
    flashcard.addEventListener('pointerup', event => {
      const distance = event.clientX - touchStartX;
      if (Math.abs(distance) > 65) move(distance < 0 ? 1 : -1);
    });
    $('#prevButton').addEventListener('click', () => move(-1));
    $('#nextButton').addEventListener('click', () => move(1));
    $('#randomButton').addEventListener('click', () => {
      state.random = !state.random;
      showToast(state.random ? '随机抽卡已开启' : '顺序复习已开启');
      render();
    });
    ratingsEl.addEventListener('click', event => {
      const button = event.target.closest('.rate-btn');
      if (button) mark(button.dataset.value);
    });
    $('#categoryChips').addEventListener('click', event => {
      const chip = event.target.closest('.chip');
      if (!chip) return;
      state.category = chip.dataset.category;
      state.currentId = visibleCards()[0]?.id || 1;
      state.flipped = false;
      render();
    });
    $('#reviewButton').addEventListener('click', () => {
      state.reviewOnly = !state.reviewOnly;
      state.currentId = visibleCards()[0]?.id || 1;
      state.flipped = false;
      render();
    });
    $('#themeButton').addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      render();
    });
    $('#voiceSelect').addEventListener('change', event => {
      state.voiceName = event.target.value;
      save();
      const voice = selectedVoice();
      showToast(voice ? `已选择 ${voice.name}` : '已使用系统默认音色');
    });
    $('#previewVoiceButton').addEventListener('click', () => {
      speak(0.90);
    });
    $('#resetButton').addEventListener('click', () => {
      if (!confirm('确定要清空全部 100 张卡的学习记录吗？')) return;
      state.statuses = {};
      state.reviewOnly = false;
      state.currentId = 1;
      render();
      showToast('学习进度已重置');
    });
    document.addEventListener('keydown', event => {
      if (event.code === 'Space') { event.preventDefault(); flip(); }
      if (event.key === 'ArrowRight') move(1);
      if (event.key === 'ArrowLeft') move(-1);
      if (state.flipped && event.key === '1') mark('again');
      if (state.flipped && event.key === '2') mark('maybe');
      if (state.flipped && event.key === '3') mark('known');
    });
    if ('speechSynthesis' in window) {
      speechSynthesis.addEventListener?.('voiceschanged', populateVoices);
      populateVoices();
      setTimeout(populateVoices, 250);
    }
    render();
  </script>
</body>
</html>
