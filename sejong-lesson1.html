' '].includes(e.key)){e.preventDefault();if(current())setFace(!flipped)}};$('#card').onpointerdown=e=>{startX=e.clientX;startY=e.clientY};$('#card').onpointerup=e=>{if(e.target.closest('button'))return;const dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){skip=true;setTimeout(()=>skip=false,350);move(dx<0?1:-1)}};$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#random').onclick=()=>{const id=current()?.id;random=!random;$('#random').classList.toggle('active',random);$('#random').setAttribute('aria-pressed',random);$('#random').setAttribute('aria-label',random?'关闭乱序':'开启乱序');reorder(id);toast(random?'随机抽卡已开启':'顺序复习已开启')};$('#lesson').onchange=e=>{lesson=e.target.value;reorder()};$('#kind').onchange=e=>{kind=e.target.value;reorder()};$('#ratings').onclick=e=>{const b=e.target.closest('[data-value]');if(b&&flipped&&current()){statuses[current().id]=b.dataset.value;save();toast(labels[b.dataset.value]);setTimeout(()=>move(1),160)}};$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;save()};$('#coverage').textContent=`共 ${cards.length} 张，${cards.filter(c=>c.audio_kind==='human').length} 张教材真人原声、${cards.filter(c=>c.audio_kind==='synth').length} 张 Yuna 合成语音。真人原声中仍有 2 条短片段识别分歧待试听核对。`;reorder();
