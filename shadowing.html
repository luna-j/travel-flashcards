<script>const cards=[{"id": "hacks-dialogue-01", "category": "安慰与冷幽默", "start": 483.5, "end": 491.2, "prompt": "对方抱怨不公平，你想安慰，却被办公室规定卡住。", "context": "办公室谈话。一句安慰，引出一条荒诞的职场规定。", "lines": [["A", "This is so unfair.", "这太不公平了。"], ["B", "Would a hug make you feel better?", "抱一下会让你好受些吗？"], ["B", "I can’t technically touch you without someone else present.", "严格来说，没有其他人在场，我不能碰你。"], ["B", "We had a meeting about it, but…", "我们为这个开过会，不过……"]], "notes": "先提出拥抱，接着补上规定，反差构成冷幽默。Would … make you feel better? 可迁移到安慰场景。", "audio": "shadowing-audio/five-01.mp3", "verification": "字幕画面人工阅读；切点估算，未试听核对", "scene": "同事觉得遭遇不公平，另一人试着安慰。", "purpose": "表达不满 → 提出安慰 → 解释限制。", "hints": [["Would … make you feel better?", "……会让你好受些吗？"], ["without someone else present", "没有其他人在场"]]}, {"id": "hacks-dialogue-03", "category": "提出建议与转折", "start": 524.4, "end": 535.1, "prompt": "客户催经纪人解决问题，经纪人顺势提出“雇个编剧”的建议。", "context": "客户抱怨演出安排，经纪人试着把话题转向一个解决办法。", "lines": [["客户", "You gotta do something about this, Jimmy.", "你得处理这件事，Jimmy。"], ["经纪人", "Okay, I will call Marty.", "好，我会给 Marty 打电话。"], ["客户", "Marty?", "Marty？"], ["经纪人", "Marty, yes. But um, I have a pitch.", "对，Marty。不过，呃，我有个提议。"], ["经纪人", "What if you hire a writer?", "要不你雇个编剧呢？"]], "notes": "You gotta… 语气直接，适合熟人或有明确工作关系的场景。What if you…? 用来提出一个可考虑的办法。", "audio": "shadowing-audio/five-02.mp3", "verification": "字幕画面人工阅读；切点估算，未试听核对", "scene": "客户要求经纪人处理问题，经纪人提出一个新办法。", "purpose": "要求行动 → 答应处理 → 提出建议。", "hints": [["do something about…", "采取行动处理……"], ["What if you…?", "要不你……？"]]}, {"id": "hacks-five-notify", "start": 498.0, "end": 506.1, "scene": "助理打断谈话提醒来电，经纪人安排接待，对方表示自己还没谈完。", "purpose": "提前提醒 → 安排接待 → 表达被打断的不满。", "hints": [["give someone a heads up", "提前提醒"], ["right in the middle of…", "正在……当中"]], "lines": [["助理", "So I’m just, like, kinda giving you a heads up.", "所以我就是来提前跟你说一声。"], ["经纪人", "Kayla, can you set her up somewhere comfortable, please?", "Kayla，能请你安排她去舒服一点的地方吗？"], ["助理", "Absolutely. Follow me, chica.", "当然。跟我来，姑娘。"], ["被打断者", "We’re right in the middle of something.", "我们正谈到一半呢。"]], "context": "助理打断正在进行的谈话，通知一位重要客户来电。", "notes": "give someone a heads up＝提前提醒；be right in the middle of something＝正在忙着。笑点在于助理把客户的重要性排序直接说了出来。", "audio": "shadowing-audio/five-03.mp3", "verification": "字幕画面人工阅读；切点估算，未试听核对"}, {"id": "hacks-five-own", "start": 607.3, "end": 618.2, "scene": "求职受挫后，一方表示要自己解决，另一方试图挽留。", "purpose": "说明仍有其他选择 → 表示自己处理 → 挽留对方。", "hints": [["handle this on my own", "自己处理这件事"], ["Come on.", "拜托／别这样（看语气）"]], "lines": [["A", "I know you think you’ve called everyone, but I actually have a lot of friends who will help me, so I guess I’ll just handle this on my own.", "我知道你觉得已经联系过所有人了，但其实我有很多愿意帮我的朋友，所以我想还是自己处理吧。"], ["B", "Ava, come on.", "Ava，别这样。"]], "context": "Ava 对工作安排不满意，准备离开办公室。", "notes": "on my own 表示自己独立完成。这里的 come on 是挽留或劝说，不是催人加速。长句不必逐字复述，先抓“我还有人能帮忙，我自己处理”。", "audio": "shadowing-audio/five-04.mp3", "verification": "字幕画面人工阅读；切点估算，未试听核对"}, {"id": "hacks-five-parking", "start": 619.5, "end": 630.0, "scene": "离开办公室前，前台询问是否需要停车优惠验证。", "purpose": "询问需要 → 确认 → 告知要等一下并找人帮忙。", "hints": [["Do you need…?", "你需要……吗？"], ["That’s gonna take me a minute.", "我需要一点时间。"]], "lines": [["前台", "Girly, do you need validation?", "姑娘，你需要停车优惠验证吗？"], ["访客", "Yeah.", "需要。"], ["前台", "Oh, God. Crap, girl. That’s gonna take me a minute. Bill, can you get Kelly to help me?", "哎呀，糟了，姑娘，这得花我一点时间。Bill，你能叫 Kelly 来帮我吗？"]], "context": "这里 validation 指停车优惠验证，不是寻求认可。", "notes": "gonna 是 going to 的口语形式。take me a minute 常表示需要一点时间，不一定恰好一分钟。girly/girl 很随意；crap 是轻度粗口，无需照搬。", "audio": "shadowing-audio/five-05.mp3", "verification": "字幕画面人工阅读；切点估算，未试听核对"}];let index=0;let shuffled=false;let order=cards.map((_,i)=>i);let cursor=0;let card=cards[index];const $=s=>document.querySelector(s);const audio=$('#audio');const dialog=$('#details');let back=false,slow=false,zh=false;const key='hacks-audio-first-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let theme=saved.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const labels={again:'还需听',maybe:'看提示能说',known:'能独立说'};function save(){try{localStorage.setItem(key,JSON.stringify(saved))}catch{}}function renderMark(){const status=saved[card.id];$('#status').textContent=labels[status]||'未练习';document.querySelectorAll('[data-value]').forEach(b=>{b.classList.toggle('chosen',b.dataset.value===status);b.setAttribute('aria-pressed',b.dataset.value===status)})}async function play(){audio.currentTime=0;audio.playbackRate=slow?.85:1;audio.preservesPitch=true;try{await audio.play()}catch{$('#playStatus').textContent='播放失败，请重试。'}}function pause(){audio.pause()}$('#mainPlay').onclick=()=>audio.paused?play():pause();$('#replay').onclick=play;$('#sheetReplay').onclick=play;audio.onplay=()=>{$('#mainPlay').textContent='Ⅱ';$('#mainPlay').setAttribute('aria-label','暂停原声');$('#playStatus').textContent=slow?'正在慢放':'正在播放'};audio.onpause=()=>{$('#mainPlay').textContent='▶';$('#mainPlay').setAttribute('aria-label','播放原声');$('#playStatus').textContent=''};audio.onended=()=>{$('#playStatus').textContent='听到了怎样的回应？试着说一遍。'};audio.onerror=()=>{$('#playStatus').textContent='原声加载失败。'};$('#slow').onclick=()=>{slow=!slow;audio.playbackRate=slow?.85:1;audio.preservesPitch=true;$('#slow').textContent=slow?'慢放：0.85×':'慢放';$('#slow').setAttribute('aria-pressed',slow);if(!audio.paused)$('#playStatus').textContent=slow?'正在慢放':'正在播放'};$('#loop').onclick=()=>{audio.loop=!audio.loop;$('#loop').textContent='循环：'+(audio.loop?'开':'关');$('#loop').setAttribute('aria-pressed',audio.loop)};function setFace(value){back=value;$('#flipCard').classList.toggle('flipped',back);$('.front').inert=back;$('.back').inert=!back;$('#ratings').classList.toggle('ready',back);$('#ratings').querySelectorAll('button').forEach(b=>b.disabled=!back);$('#flipCard').setAttribute('aria-pressed',back)}let skipFlip=false;$('#flipCard').onclick=e=>{if(skipFlip){skipFlip=false;return}if(e.target.closest('button'))return;setFace(!back)};$('#translations').onclick=()=>{zh=!zh;document.querySelectorAll('.translation').forEach(e=>e.hidden=!zh);$('#translations').textContent=zh?'隐藏中文':'显示中文';$('#translations').setAttribute('aria-pressed',zh)};$('#openDetails').onclick=()=>{audio.pause();zh=false;document.querySelectorAll('.translation').forEach(e=>e.hidden=true);$('#translations').textContent='显示中文';$('#translations').setAttribute('aria-pressed','false');dialog.showModal()};$('#closeDetails').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{audio.pause();$('#openDetails').focus()});$('#ratings').onclick=e=>{const b=e.target.closest('[data-value]');if(b){saved[card.id]=b.dataset.value;save();renderMark();showToast(labels[b.dataset.value]);setTimeout(()=>moveCard(1),160)}};$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;saved.theme=theme;save()};document.documentElement.dataset.theme=theme;renderMark();function loadCard(){audio.pause();card=cards[index];audio.src=card.audio;audio.playbackRate=slow?.85:1;zh=false;setFace(false);$('#hints').scrollTop=0;$('#playStatus').textContent='';$('#mainPlay').textContent='▶';$('#mainPlay').setAttribute('aria-label','播放原声');$('#position').textContent=`${index+1} / ${cards.length} · 对话练习`;$('#duration').textContent=`约 ${Math.round(card.end-card.start)} 秒`;$('#scene').textContent=card.scene;$('#purpose').textContent=card.purpose;$('#languageHints').replaceChildren();for(const [phrase,meaning]of card.hints){const h=document.createElement('div');h.className='hint';for(const [text,cls]of [[phrase,'phrase'],[meaning,'meaning']]){const e=document.createElement('div');e.className=cls;e.textContent=text;h.append(e)}$('#languageHints').append(h)}$('#transcript').replaceChildren();for(const [speaker,en,translation]of card.lines){const turn=document.createElement('div');turn.className='turn';for(const [text,cls]of [[speaker,'speaker'],[en,'english'],[translation,'translation']]){const el=document.createElement('div');el.textContent=text;el.className=cls;if(cls==='translation')el.hidden=true;turn.append(el)}$('#transcript').append(turn)}$('#context').textContent=card.context;$('#notes').textContent=card.notes;renderMark()}$('#flipCard').onkeydown=e=>{if(e.target===e.currentTarget&&['Enter',' '].includes(e.key)){e.preventDefault();e.currentTarget.click()}};let touchX=0;$('#flipCard').addEventListener('pointerdown',e=>{touchX=e.clientX});$('#flipCard').addEventListener('pointerup',e=>{if(e.target.closest('button'))return;const delta=e.clientX-touchX;if(Math.abs(delta)>65){skipFlip=true;setTimeout(()=>skipFlip=false,350);moveCard(delta<0?1:-1)}});function moveCard(d){cursor=(cursor+d+order.length)%order.length;index=order[cursor];loadCard()}$('#prev').onclick=()=>moveCard(-1);$('#next').onclick=()=>moveCard(1);$('#shuffle').onclick=()=>{shuffled=!shuffled;if(shuffled){const rest=cards.map((_,i)=>i).filter(i=>i!==index);for(let j=rest.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[rest[j],rest[k]]=[rest[k],rest[j]]}order=[index,...rest];cursor=0}else{order=cards.map((_,i)=>i);cursor=index}$('#shuffle').classList.toggle('active',shuffled);$('#shuffle').setAttribute('aria-pressed',shuffled);$('#shuffle').setAttribute('aria-label',shuffled?'关闭乱序':'开启乱序');$('#shuffle').title=shuffled?'乱序已开启':'乱序';showToast(shuffled?'随机抽卡已开启':'顺序复习已开启');};let toastTimer;function showToast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1500)}loadCard();</script></body></html>
